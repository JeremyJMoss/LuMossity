services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh
    ports:
      - "3307:3306"
    networks:
      - app-network

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    volumes:
      - ./api:/app/api
      - /app/api/node_modules
    env_file:
      - api/.env
    ports:
      - "4000:4000"
    expose:
      - "4000"
    networks:
      - app-network
    depends_on:
      - mysql
  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    volumes:
      - ./ui:/app/ui
      - /app/ui/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ui/.env
    depends_on:
      - api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
  
volumes:
  mysql_data: {}